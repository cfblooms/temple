<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心靈大廟</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Q 版賽博廟宇：用打火機點燭點香、燒金紙、擲筊、抽籤、摸虎爺、做祈福卡。">
<meta name="theme-color" content="#7A1E1A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Serif+TC:wght@600;900&display=swap">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="me" id="btnAvatar" aria-label="編輯我的人偶">
      <img id="meThumb" alt="">
      <span class="me-name" id="meName">香客</span>
    </button>
    <div class="lunar" id="lunar" role="button" title="點一下預覽節慶廟"></div>
    <div class="top-right">
      <button type="button" class="fu" id="btnFu" title="福氣幣（點一下逛供品店）" aria-label="福氣幣，點一下打開廟口供品店"><i class="fu-coin" aria-hidden="true">福</i><b id="fuCount">0</b></button>
      <span class="fish" title="開運小魚乾" aria-label="開運小魚乾數量"><svg viewBox="0 0 24 14" aria-hidden="true"><path d="M2 7c4-6 11-6 15 0-4 6-11 6-15 0z" fill="var(--gold)"/><path d="M17 7l5-4v8z" fill="var(--gold)"/><circle cx="6" cy="6" r="1.2" fill="var(--ink)"/></svg><b id="fishCount">0</b></span>
      <button class="icon-btn map-btn" id="btnMap" aria-label="逛廟：打開全廟地圖"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="2"/></svg>逛廟</button>
      <button class="icon-btn" id="btnMute" aria-label="關閉聲音">聲</button>
    </div>
  </header>

  <div class="say" id="say" role="status" aria-live="polite">
    <span class="say-who" id="sayWho">廟公</span>
    <span class="say-text" id="sayText">歡迎來參拜。順序是點燭、上香，再抽籤；擲筊可以隨時問神明。</span>
  </div>

  <main class="stage">
    <div class="map-view" id="mapView">
      <div class="map-wrap" id="mapWrap"><img id="mapImg" alt="心靈大廟全廟地圖：山門、廟埕、正殿、兩廂專科殿堂與後院靜心閣"></div>
    </div>
    <div class="scene-wrap" id="sceneWrap" hidden>
      <div id="sceneHost"></div>
      <div id="caiHost" hidden></div>
      <div id="yueHost" hidden></div>
      <div id="tudiHost" hidden></div>
      <div id="wenHost" hidden></div>
      <div id="jiHost" hidden></div>
      <div id="sanHost" hidden></div>
      <div id="gyHost" hidden></div>
      <div id="ggHost" hidden></div>
      <div id="zsHost" hidden></div>
      <div id="tsHost" hidden></div>
      <div id="muHost" hidden></div>
      <div id="mlHost" hidden></div>
      <div id="jgHost" hidden></div>
      <div id="bzHost" hidden></div>
      <div id="sjHost" hidden></div>
      <div id="xrHost" hidden></div>
      <div id="jqHost" hidden></div>
      <div id="fsHost" hidden></div>
      <div id="xiHost" hidden></div>
      <div id="tgHost" hidden></div>
      <div id="fhHost" hidden></div>
      <div id="jxHost" hidden></div>
      <canvas id="fx" aria-hidden="true"></canvas>
      <button type="button" class="basket-chip" id="basketBtn" aria-label="供品籃：把供品擺上供桌" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10a5 5 0 0 1 10 0" fill="none" stroke="#8A5A32" stroke-width="1.8"/><path d="M3 10h18l-2 10H5z" fill="#D9A55A" stroke="#8A5A32" stroke-width="1.2"/><path d="M6 13h12M7 16h10" stroke="#8A5A32" stroke-width="1"/><circle cx="9" cy="8.6" r="2.2" fill="#E0443E"/><circle cx="14.5" cy="8.2" r="2.4" fill="#F28A1E"/></svg><span>供品</span><i id="basketN" hidden>0</i></button>
      <div class="gods" id="godBar" role="tablist" aria-label="今天要拜哪位神明"></div>
    </div>
  </main>

  <nav class="bar" id="bar" aria-label="參拜動作" hidden>
    <button data-act="candle"><svg viewBox="0 0 24 24"><path d="M12 2c2 3 2 5 0 6-2-1-2-3 0-6z" fill="var(--gold)"/><rect x="7" y="9" width="10" height="12" rx="4" fill="var(--red)"/></svg><span>點燭</span></button>

    <button data-act="card"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/><rect x="7" y="5" width="10" height="9" fill="var(--red)"/><rect x="13" y="16" width="4" height="4" fill="var(--red)"/></svg><span>祈福卡</span></button>

  </nav>
